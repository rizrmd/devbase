{{ define "base-layout" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.6/dist/basecoat.cdn.min.css">
    <script src="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.6/dist/js/all.min.js" defer></script>
</head>
<body class="bg-gray-100 min-h-screen">
    {{ if .IsAuthenticated }}
    <nav class="nav bg-blue-600 text-white">
        <div class="nav__start">
            <a href="/users" class="text-xl font-bold">DevBase</a>
            <span class="badge ml-4">User Manager</span>
        </div>
        <div class="nav__end">
            <a href="/users" class="nav__link">Users</a>
            <a href="/admin/password" class="nav__link">Change Password</a>
            <a href="/logout" class="btn btn-ghost">Logout</a>
        </div>
    </nav>
    {{ end }}

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {{ if .Success }}
        <div class="alert mb-4 border-l-4 border-green-500 bg-green-50">
            {{ .Success }}
        </div>
        {{ end }}

        {{ if .Error }}
        <div class="alert alert-destructive mb-4">
            {{ .Error }}
        </div>
        {{ end }}

        {{ block "content" . }}{{ end }}
    </main>

    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(function() {
                alert('Copied to clipboard!');
            }, function(err) {
                alert('Failed to copy: ' + err);
            });
        }

        function confirmDelete(username) {
            return confirm('Are you sure you want to delete user "' + username + '"? This action cannot be undone.');
        }
    </script>
</body>
</html>
{{ end }}
