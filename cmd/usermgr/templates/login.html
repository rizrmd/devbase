{{ define "login.html" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.6/dist/basecoat.cdn.min.css">
    <script src="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.6/dist/js/all.min.js" defer></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    {{ if .Error }}
    <div class="alert alert-destructive mb-4 w-full max-w-md">
        {{ .Error }}
    </div>
    {{ end }}

    <div class="card w-full max-w-md">
        <header>
            <h2>DevBase User Manager</h2>
            <p>Enter your details below to login to your account</p>
        </header>

        <section>
            <form id="login-form" action="/login" method="POST" class="form grid gap-6">
                <div class="grid gap-2">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autofocus
                    >
                </div>

                <div class="grid gap-2">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >
                </div>
            </form>
        </section>

        <footer class="flex flex-col gap-2">
            <button type="submit" form="login-form" class="btn btn-primary w-full">Login</button>
        </footer>
    </div>

    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(function() {
                alert('Copied to clipboard!');
            }, function(err) {
                alert('Failed to copy: ' + err);
            });
        }

        function confirmDelete(username) {
            return confirm('Are you sure you want to delete user "' + username + '"? This action cannot be undone.');
        }
    </script>
</body>
</html>
{{ end }}
