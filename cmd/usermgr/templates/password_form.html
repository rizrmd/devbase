{{ define "content" }}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Change Admin Password</h1>

    <form action="/admin/password" method="POST" class="space-y-4">
        <div>
            <label for="old_password" class="block text-sm font-medium text-gray-700 mb-1">Current Password *</label>
            <input
                type="password"
                id="old_password"
                name="old_password"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
        </div>

        <div>
            <label for="new_password" class="block text-sm font-medium text-gray-700 mb-1">New Password *</label>
            <input
                type="password"
                id="new_password"
                name="new_password"
                required
                minlength="8"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <p class="mt-1 text-xs text-gray-500">Minimum 8 characters</p>
        </div>

        <div>
            <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password *</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                required
                minlength="8"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
        </div>

        <button
            type="submit"
            onclick="return validatePassword()"
            class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
            Change Password
        </button>
    </form>

    <div class="mt-6">
        <a href="/users" class="text-blue-600 hover:text-blue-800">Back to Users</a>
    </div>
</div>

<script>
function validatePassword() {
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('confirm_password').value;

    if (newPassword !== confirmPassword) {
        alert('Passwords do not match!');
        return false;
    }

    if (newPassword.length < 8) {
        alert('Password must be at least 8 characters long!');
        return false;
    }

    return true;
}
</script>
{{ end }}
