{{ define "password_form.html" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.6/dist/basecoat.cdn.min.css">
    <script src="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.6/dist/js/all.min.js" defer></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <nav class="nav bg-blue-600 text-white fixed top-0 left-0 right-0">
        <div class="nav__start">
            <a href="/users" class="text-xl font-bold">DevBase</a>
            <span class="badge ml-4">User Manager</span>
        </div>
        <div class="nav__end">
            <a href="/users" class="nav__link">Users</a>
            <a href="/admin/password" class="nav__link">Change Password</a>
            <a href="/logout" class="btn btn-ghost">Logout</a>
        </div>
    </nav>

    <main class="w-full max-w-md mt-16">
        {{ if .Success }}
        <div class="alert alert-success mb-4">
            {{ .Success }}
        </div>
        {{ end }}

        {{ if .Error }}
        <div class="alert alert-error mb-4">
            {{ .Error }}
        </div>
        {{ end }}

        <div class="card w-full">
            <header>
                <h2>Change Admin Password</h2>
                <p>Enter your current password and choose a new one</p>
            </header>

            <section>
                <form id="password-form" action="/admin/password" method="POST" class="form grid gap-6">
                    <div class="grid gap-2">
                        <label for="old_password">Current Password *</label>
                        <input
                            type="password"
                            id="old_password"
                            name="old_password"
                            required
                        >
                    </div>

                    <div class="grid gap-2">
                        <label for="new_password">New Password *</label>
                        <input
                            type="password"
                            id="new_password"
                            name="new_password"
                            required
                            minlength="8"
                        >
                        <p class="text-sm text-gray-500">Minimum 8 characters</p>
                    </div>

                    <div class="grid gap-2">
                        <label for="confirm_password">Confirm New Password *</label>
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            required
                            minlength="8"
                        >
                    </div>
                </form>
            </section>

            <footer class="flex flex-col gap-2">
                <button type="submit" form="password-form" class="btn btn-primary w-full">
                    Change Password
                </button>
                <a href="/users" class="btn btn-ghost w-full">Back to Users</a>
            </footer>
        </div>
    </main>

    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(function() {
                alert('Copied to clipboard!');
            }, function(err) {
                alert('Failed to copy: ' + err);
            });
        }

        function confirmDelete(username) {
            return confirm('Are you sure you want to delete user "' + username + '"? This action cannot be undone.');
        }

        function validatePassword() {
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (newPassword !== confirmPassword) {
                alert('Passwords do not match!');
                return false;
            }

            if (newPassword.length < 8) {
                alert('Password must be at least 8 characters long!');
                return false;
            }

            return true;
        }

        // Add validation to form submission
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('password-form');
            form.addEventListener('submit', function(e) {
                if (!validatePassword()) {
                    e.preventDefault();
                }
            });
        });
    </script>
</body>
</html>
{{ end }}
