services:
  devbase:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devbase
    ports:
      - "2222:2222"  # SSH
      - "8080:8080"  # User Manager Web UI
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DB_PATH=/var/lib/devbase/users.db
      - LISTEN_ADDR=:8080
      - BASE_HOME_DIR=/devbase
    volumes:
      - devbase_data:/devbase
      - devbase_db:/var/lib/devbase
    restart: unless-stopped

volumes:
  devbase_data:
    driver: local
  devbase_db:
    driver: local
